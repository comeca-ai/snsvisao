# Evolution API v2 — stack para rodar na máquina DigitalOcean (Docker Compose)
# Passo a passo no README.md ao lado.
services:
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: evolution
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file: .env
    environment:
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: 'postgresql'
      DATABASE_CONNECTION_URI: 'postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: 'redis://redis:6379/0'
      CACHE_REDIS_PREFIX_KEY: 'evolution'
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_pg:
  evolution_redis:
